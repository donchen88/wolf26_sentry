local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 20.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.2
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "escape_bias_layer"]
      obstacle_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 0.3
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        unknown_cost: 0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: rgbd1_mark rgbd1_clear obstacle_clear
        rgbd1_mark:
          data_type: PointCloud2
          topic: <robot_namespace>/terrain_map
          marking: true
          clearing: false
          obstacle_range: 25.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
          vertical_fov_angle: 2.356
          horizontal_fov_angle: 6.28
        rgbd1_clear:
          data_type: PointCloud2
          topic: <robot_namespace>/terrain_map
          marking: false
          clearing: true
          max_z: 10.0
          min_z: 0.0
          vertical_fov_angle: 2.356
          horizontal_fov_angle: 6.28
          decay_acceleration: 1.0
          model_type: 0
          obstacle_range: 25.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        obstacle_clear:
          # ---- 障碍物清除 ----
          enabled: true
          data_type: PointCloud2
          topic: <robot_namespace>/obstacle_clear_cloud
          marking: false
          clearing: true
          # ---- 高度过滤 ----
          min_z: -10.0
          max_z: 10.0
          # ---- FOV（视野范围）----
          vertical_fov_angle: 3.14159
          horizontal_fov_angle: 6.29
          # ---- 衰减与模型 ----
          decay_acceleration: 0.0
          model_type: 1
        # plugin: "pb_nav2_costmap_2d::IntensityObstacleLayer"
        # enabled: True
        # footprint_clearing_enabled: True
        # min_obstacle_intensity: 0.1
        # max_obstacle_intensity: 256.0
        # observation_sources:  terrain_map
        # terrain_map:
        #   # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
        #   # It doesn't need to start with '/'
        #   topic: <robot_namespace>/terrain_map
        #   clearing: true
        #   marking: true
        #   data_type: "PointCloud2"
        #   min_obstacle_height: 0.0  
        #   max_obstacle_height: 2.0
        #   obstacle_max_range: 4.5
        #   obstacle_min_range: 0.1
        #   raytrace_max_range: 5.5
        #   raytrace_min_range: 0.01
        #   observation_persistence: 0.08      # 关键：不留“历史点”
        #   expected_update_rate: 0.1
        # lidar_clear:
        #   topic: <robot_namespace>/terrain_map
        #   data_type: "PointCloud2"
        #   marking: False
        #   clearing: True
        #   min_obstacle_height: -0.5
        #   max_obstacle_height: 2.0
        #   raytrace_min_range: 0.1
        #   raytrace_max_range: 4.2
        #   observation_persistence: 0.0
        #   expected_update_rate: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"   
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.6
      escape_bias_layer:
        plugin: "escape_bias_layer::EscapeBiasLayer"
        enabled: true
        sector_count: 16
        sample_radius_min: 0.6
        sample_radius_max: 1.2
        bias_cost: 50.0
      always_send_full_costmap: False

