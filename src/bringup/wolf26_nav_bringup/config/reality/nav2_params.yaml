    #     consider_footprint: true # 是使用点成本（如果机器人是圆形或低计算能力）还是计算 SE2 占地成本。
    #     collision_cost: 10000.0 # 适用于轨迹真实碰撞的成本。
    #     collision_margin_distance: 0.2 # 距离碰撞的距离（m）将施加严重罚款，类似于建筑面积膨胀。0.05 到 0.2 之间是合理的。注意，这会极大影响控制器进入比这更狭窄的空间，所以确保这个参数设置得比你预期机器人需要穿越的最窄范围更低。
    #     near_goal_distance: 1.0 # 距离（m）接近目标，停止应用优先障碍项，使机器人能够在靠近障碍物时平稳收敛到目标姿势。
    #     cost_scaling_factor: 4.0 # 纵横于膨胀半径的指数衰减因子。这应该和你的充气层（仅限 Humble）相同。
    #     inflation_radius: 0.4 # 半径用于充气致命障碍物周围的成本地图。这应该和你的充气层（仅限 Humble）相同。
    #     inflation_layer_name: "inflation_layer" #膨胀层的名称。如果是空的，则使用成本图中的最后一层通胀。如果你有多个膨胀层，可能需要指定要使用的层名称。
    #   # # 成本批评
    #   # CostCritic:
    #   # enabled: true
    #   # cost_power: 1
    #   # cost_weight: 2.0
    #   # critical_cost: 200.0
    #   # consider_footprint: true
    #   # collision_cost: 500000.0
    #   # near_collision_cost: 253
    #   # near_goal_distance: 1.0
    #   # inflation_layer_name: "inflation_layer"
    #   # trajectory_point_step: 2
    #   # 路径调整批评
    #   PathAlignCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 1.2
    #     max_path_occupancy_ratio: 0.25 # 路径中可占据的最大比例不允许该批评者占据障碍物和路径跟随者，以在场景中动态物体存在时，遵循路径意图避开障碍物。0-1%的0-1%。
    #     trajectory_point_step: 4 # 在评论中评估它们时，采取路径的步骤。由于轨迹极其密集，无需逐点评估，计算量也较高。
    #     threshold_to_consider: 1.0 # 机器人与目标之间的距离（m）可以停止考虑路径对齐，让目标批评者接管。
    #     offset_from_furthest: 14 # 检查候选路径是否已足够远，跟踪路径以应用对齐批评者。这确保路径对齐仅在实际跟踪路径时考虑，避免因机器人偏离路径而出现尴尬的初始化动作。
    #     use_path_orientations: false # 是否在路径对齐中考虑路径方向，这在配合可行的 SMAC 规划器时非常有用，可以激励只在 SMAC 规划器请求时进行方向变更。如果你想让机器人偏离并反转方向，控制器认为合适的方向，就保持为 false。如果你的计划中没有包含方向信息（例如 navfn），请保持为虚假。
    #   # 路径跟随批评者
    #   PathFollowCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 4.0
    #     offset_from_furthest: 20 # 任何轨迹在距离一之后的路径点数，以驱动相对于的路径跟踪。
    #     threshold_to_consider: 1.0 # 机器人与目标之间的距离（m）可停止考虑路径跟踪，让目标批评者接管。明智的做法是将这与你的预测视野视野相同，以便与射手保持清晰的交接。
    #   # PathAngleCritic:
    #   #   enabled: true
    #   #   cost_power: 1
    #   #   cost_weight: 2.0
    #   #   offset_from_furthest: 4
    #   #   threshold_to_consider: 0.5
    #   #   max_angle_to_furthest: 1.0
    #   #   forward_preference: true
    #   # VelocityDeadbandCritic:
    #   #   enabled: true
    #   #   cost_power: 1
    #   #   cost_weight: 45.0
    #   #   deadband_velocities: [0.55, 0.55, 0.0]
    #   TwirlingCritic:
    #     enabled: true
    #     twirling_cost_power: 1
    #     twirling_cost_weight: 40.0

    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      translation_kp: 2.0
      translation_ki: 0.0
      translation_kd: 0.2
      enable_rotation: false
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      transform_tolerance: 0.1
      min_max_sum_error: 0.5
      lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.6
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      use_interpolation: true
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.5
      v_linear_min: -1.2
      v_linear_max: 1.2
      v_angular_min: -1.2
      v_angular_max: 1.2
      curvature_min: 0.3                                # 低曲率阈值，低于此值不减速。
      curvature_max: 1.2                                # 高曲率阈值，高于此值大幅减速。
      reduction_ratio_at_high_curvature: 0.5            # 高曲率时的速度降低比例。 0.5 (即减速 50%)
      curvature_forward_dist: 1.0                       # 前向距离，用于曲率计算
      curvature_backward_dist: 1.0                      # 后向距离，用于曲率计算
      max_velocity_scaling_factor_rate: 1.0             # 速度缩放因子的最大变化率
      slowdown_zone_map_topic: "<robot_namespace>/slowdown_map"
      slowdown_zone_ratio: 0.45
      slowdown_zone_threshold: 10
      slowdown_zone_detection_dist: 1.4
      slowdown_zone_forbidden_ratio: 0.65
      slowdown_zone_forbidden_threshold: 100
      slowdown_zone_forbidden_detection_dist: 1.4
      # 提前给下位机减速信号的半径 (m): 机器人中心到此范围内的任意减速格都发 true,
      # 与 slowdown_zone_layer.inflation_dist 保持一致.
      slowdown_zone_inflation_dist: 0.3
      min_cmd_vel_in_slowdown_zone: 0.3
    
