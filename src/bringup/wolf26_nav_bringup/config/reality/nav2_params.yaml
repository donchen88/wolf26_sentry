smoother_server:
  ros__parameters:
    smoother_plugins: ["sg_smoother"]
    sg_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 21              # 窗口越大越平滑
      polynomial_order: 3
      max_its: 100
      tolerance: 1.0e-10
      do_refinement: True


behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      # plugin: "pb_nav2_behaviors/BackUpFreeSpace"
      plugin: "nav2_behaviors/BackUpTwzFree"   # C++ 类名（确保 plugin.xml / export 与此一致）
      robot_radius: 0.1
      max_radius: 1.5
      free_threshold: 3
      cost_threshold: 50
      service_name: "local_costmap/get_costmap"
      visualization: true
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
    # params for pb_nav2_behaviors/BackUpFreeSpace
    # service_name: "global_costmap/get_costmap"
    # max_radius: 0.6
    # visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 10


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 60.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 3.0, 4.0]
    min_velocity: [-3.0, -3.0, -4.0]
    max_accel: [2.0, 2.0, 1.0]
    max_decel: [-2.0, -2.0, -6.0]
    odom_duration: 0.05
    deadband_velocity: [0.015, 0.015, 0.015]
    velocity_timeout: 2.0
    odom_topic: "odometry"



