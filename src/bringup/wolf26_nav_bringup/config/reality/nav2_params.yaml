terrain_analysis:
  ros__parameters:
    sensor_frame: "front_mid360"
    scan_voxel_size: 0.05               # 点云下采样     
    decay_time: 0.3                     # 点云时间差阈值 大于则不会被处理  0.20
    no_decay_dis: 2.0                   # 点云距离阈值 小于该阈值不考虑时间差
    clearing_dis: 3.0                   # 该距离外的点会被清除
    use_sorting: false                  # 这个参数开起来就能上坡了；如果 use_sorting,那么就以周围点中的分位点作为地面点，否则以最低点作为地面点；周围其余点相对于地面点的高度作为通过代价，所以对于坡面，有的点的代价是正，有的是负，就相互抵消了；不要与 consider_drop 同时开启，计算上会有冲突
    quantile_z: 0.2                     # useful if use_sorting is enabled.
    consider_drop: false                # 考虑凹下去的地面,开启则将相对于地面点的高度取绝对值
    limit_ground_lift: True            # useful if use_sorting is enabled
    max_ground_lift: 0.5                # useful if use_sorting is enabled
    clear_dy_obs: true                  # 清除动态物体的话，有动态物体走过的地方就走不了了    
    vertical_surface_as_static: True
    vertical_surface_min_z_span: 0.1
    vertical_surface_min_point_num: 2
    vertical_surface_min_cluster_size: 2
    min_dy_obs_dis: 0.15                 # 以下参数都是在 clear_dy_obs 的情况下才有用的
    min_dy_obs_angle: 0.15
    min_dy_obs_rel_z: -0.2
    abs_dy_obs_rel_z_thre: 0.25
    min_dy_obs_vfov: -28.0
    max_dy_obs_vfov: 33.0
    min_dy_obs_point_num: 2
    num_layers: 1
    layer_redundancy: 0.025
    auto_layer_height_offset: True
    layer_height_offset": 0.0
    no_data_obstacle: False             # treat no data as obstacle     
    no_data_block_skip_num: 0
    min_block_point_num: 2
    vehicle_height: 0.6                 # 小于车辆高度的点才会进行处理
    max_slope: 0.7
    voxel_point_update_thre: 3
    voxel_time_update_thre: 0.05        #0.15
    min_rel_z: -1.5                     # min_rel_z 以及 max_rel_z 限制了有效点云点的Z值范围，用于对天花板和地板进行处理
    max_rel_z: 1.5
    dis_ratio_z: 1.2                    # Z 值的最大最小范围由这两个值决定，但是并不等于这两个值，是有一个比例关系的，距离机器人越远，限定范围就越大，这其中考虑了坡度
    terrain_publish_half_width: -1      #terrain_cloud 拼接半径(网格数) <=0 表示发布terrain 全宽 (默认10)
    enable_obstacle_clearing: true
    obstacle_clearing_dis: 8.0
    obstacle_height_thre: 0.3
    obstacle_confirm_frames: 2
    obstacle_persist_frames: 1

